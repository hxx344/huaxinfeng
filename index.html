<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>花信风</title>
<style>
  :root { --gold: #f3c35a; --ink: rgba(18, 22, 34, 0.55); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1420; color: #fff;
    font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .serif { font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif; }

  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(10, 16, 30, 0.15), rgba(10, 16, 30, 0.6));
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6); transition: opacity 0.9s; z-index: 5; }
  #title.gone { opacity: 0; pointer-events: none; }
  #title h1 { font-size: clamp(56px, 11vw, 132px); margin: 0; letter-spacing: 0.18em; font-weight: 600; }
  #title .tag { font-size: clamp(15px, 1.7vw, 22px); letter-spacing: 0.35em; margin: 6px 0 34px; opacity: 0.92; }
  #start { font: inherit; font-size: 20px; letter-spacing: 0.5em; padding: 12px 30px 12px 40px; color: #1c1404;
    background: var(--gold); border: 0; border-radius: 999px; cursor: pointer; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); }
  #start:disabled { background: rgba(255, 255, 255, 0.25); color: #fff; cursor: default; }
  #start:not(:disabled):hover { filter: brightness(1.08); }
  #loading { height: 22px; margin-top: 14px; font-size: 14px; opacity: 0.85; }
  #keys { margin-top: 26px; display: grid; grid-template-columns: auto auto; gap: 5px 18px; font-size: 13.5px;
    background: var(--ink); padding: 14px 20px; border-radius: 12px; text-shadow: none; }
  #keys kbd { font: inherit; color: var(--gold); text-align: right; }

  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.6s; z-index: 3;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); }
  #hud.on { opacity: 1; }
  #hud.hidden { opacity: 0; }
  .panel { position: absolute; background: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
  #errand { top: 16px; left: 16px; line-height: 1.6; }
  #errand b { color: var(--gold); font-size: 17px; }
  #stats { bottom: 16px; left: 16px; min-width: 190px; line-height: 1.7; }
  #stats .big { font-size: 30px; font-weight: 600; }
  #gust { height: 7px; border-radius: 4px; background: rgba(255, 255, 255, 0.2); overflow: hidden; margin: 2px 0 6px; }
  #gust-fill { height: 100%; background: linear-gradient(90deg, #8fd4ff, #fff); transform-origin: left; }
  #flip-hint { color: var(--gold); }
  #compass { position: absolute; top: 16px; left: 50%; width: min(360px, 44vw); height: 34px; margin-left: calc(min(360px, 44vw) / -2);
    background: var(--ink); border-radius: 999px; overflow: hidden; }
  #compass .mark, #compass .pin { position: absolute; left: 50%; top: 0; line-height: 34px; margin-left: -8px; width: 16px;
    text-align: center; font-size: 14px; }
  #compass .pin { top: 11px; height: 12px; width: 12px; margin-left: -6px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 10px var(--gold); }
  #compass .pin.edge { opacity: 0.6; }
  #compass::after { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 6px; background: #fff; opacity: 0.7; }
  #prompt { position: absolute; bottom: 86px; left: 50%; transform: translateX(-50%); background: var(--ink); padding: 9px 18px;
    border-radius: 999px; font-size: 15px; opacity: 0; transition: opacity 0.25s; white-space: nowrap; }
  #prompt.show { opacity: 1; }
  #toast-box { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); text-align: center; opacity: 0;
    transition: opacity 0.4s; max-width: 80vw; }
  #toast-box.show { opacity: 1; }
  #toast { font-size: 26px; letter-spacing: 0.08em; }
  #toast-sub { font-size: 14.5px; opacity: 0.92; margin-top: 4px; }
  #journal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(520px, 90vw); max-height: 80vh;
    overflow: auto; background: rgba(24, 20, 14, 0.88); border: 1px solid rgba(243, 195, 90, 0.5); border-radius: 14px;
    padding: 18px 24px; display: none; z-index: 4; }
  #journal.show { display: block; }
  #journal h2 { margin: 0 0 10px; letter-spacing: 0.3em; font-weight: 600; color: var(--gold); }
  #journal ul { list-style: none; margin: 0; padding: 0; }
  #journal li { padding: 8px 0; border-top: 1px solid rgba(255, 255, 255, 0.12); font-size: 14px; opacity: 0.75; }
  #journal li.found { opacity: 1; }
  #journal li b { display: block; font-size: 15.5px; margin-bottom: 2px; }
  #journal li.found b { color: var(--gold); }
  #journal p { font-size: 12.5px; opacity: 0.6; margin: 10px 0 0; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div id="errand" class="panel">包裹送往 <b id="target-name">…</b> · <span id="target-dist"></span><br>已送达 <span id="delivered">0</span> 件</div>
  <div id="compass"></div>
  <div id="toast-box"><div id="toast" class="serif"></div><div id="toast-sub"></div></div>
  <div id="prompt"></div>
  <div id="stats" class="panel">
    <span class="big" id="speed">0</span> 公里/时
    <div id="gust"><div id="gust-fill"></div></div>
    风种 <span id="seeds">0</span> <span id="flip-hint">· Q 翻转</span><br>
    宝物 <span id="found">0/8</span> · J 手记
  </div>
</div>

<div id="journal">
  <h2 class="serif">手记</h2>
  <ul id="journal-list"></ul>
  <p>按 J 合上</p>
</div>

<div id="title">
  <h1 class="serif">花信风</h1>
  <div class="tag serif">一把扫帚 · 一座岛 · 一阵好风</div>
  <button id="start" disabled>稍候</button>
  <div id="loading">正在准备…</div>
  <div id="keys">
    <kbd>W S / ↑ ↓</kbd><span>俯冲、拉起</span>
    <kbd>A D / ← →</kbd><span>侧倾转向</span>
    <kbd>Shift</kbd><span>乘阵风加速</span>
    <kbd>空格</kbd><span>减速；靠近亮起的平台时连按两次降落，再按起飞</span>
    <kbd>Q</kbd><span>翻转（接住十颗风种之后）</span>
    <kbd>J</kbd><span>宝物手记</span>
    <kbd>鼠标</kbd><span>点击画面后用鼠标操纵，左键加速，右键减速</span>
    <kbd>C · I · P · M</kbd><span>切换镜头 · 反转俯仰 · 隐藏界面 · 静音</span>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
